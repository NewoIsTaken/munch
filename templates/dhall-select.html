{% extends "layout.html" %}


{% block main %}

<h2 class="text-4xl font-semibold text-off-black text-center mb-8">
	Choose your dining hall:
</h2>

<form action="get"></form>
<select class="w-full px-3 py-2.5 border border-2 text-heading shadow-md rounded-md">
	<option value="" disabled selected>Dining Halls</option>
	{% for dhall in dhalls %}

	<option value="{{ dhall['location_id'] }}">{{ dhall["location_name"] }}</option>

	{% endfor %}
</select>
</form>

{% endblock %}
