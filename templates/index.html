{% extends "layout.html" %}

{% block page_header %}
<div class="w-full bg-stone py-3 flex justify-center shadow">
  <h2 class="text-2xl font-semibold text-off-black">
    Home
  </h2>
</div>
{% endblock %}

{% block main %}
<div class="w-full max-w-md px-4 mt-0 space-y-5">

  <!-- RATE -->
  <a href="{{ url_for('rate') }}"
     class="w-full sm:w-80 bg-mint-leaf rounded-full
            py-3 flex items-center justify-center gap-3
            text-off-black text-2xl font-black italic shadow-lg
            hover:scale-105 hover:shadow-xl transition">
    <span>RATE</span>
    <span class="text-3xl">⭐</span>
  </a>

  <!-- MENU -->
  <a href="{{ url_for('menu') }}"
     class="w-full sm:w-80 bg-mint-leaf rounded-full
            py-3 flex items-center justify-center gap-3
            text-off-black text-2xl font-black italic shadow-lg
            hover:scale-105 hover:shadow-xl transition">
    <span>MENU</span>
    <span class="text-3xl">📋</span>
  </a>

  <!-- REVIEWS -->
  <a href="{{ url_for('reviews') }}"
     class="w-full sm:w-80 bg-mint-leaf rounded-full
            py-3 flex items-center justify-center gap-3
            text-off-black text-2xl font-black italic shadow-lg
            hover:scale-105 hover:shadow-xl transition">
    <span>REVIEWS</span>
    <span class="text-3xl">📝</span>
  </a>

  <!-- ABOUT -->
  <a href="{{ url_for('about') }}"
     class="w-full sm:w-80 bg-mint-leaf rounded-full
            py-3 flex items-center justify-center gap-3
            text-off-black text-2xl font-black italic shadow-lg
            hover:scale-105 hover:shadow-xl transition">
    <span>ABOUT</span>
    <span class="text-3xl">ℹ️</span>
  </a>

</div>
